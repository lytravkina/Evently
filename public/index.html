<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Document</title>
  </head>
  <body class="body">
    <header class="header">
      <div class="logo">Event<span>ly</span></div>
      <nav class="menu">
        <button class="menu__item">Мероприятия</button>
        <button class="menu__item">Мои записи</button>
      </nav>
    </header>
    <main class="events-page">
      <section class="hero">
        <div class="hero__subtitle subtitle">Подзаголовок</div>
        <h1 class="hero__title title">Заголовок</h1>
        <p class="hero__description description">
          Выбирай интересное мероприятие и записывайся в пару кликов.
        </p>
      </section>
      <section class="events">
        <div class="events__filters">
          <form class="filters-form form">
            <input
              type="text"
              placeholder="Поиск по названию и описанию..."
              class="filters-form__input input"
            />
            <select class="filters-form__select select">
              <option class="filters-form__option" value="" selected>
                Все категории
              </option>
            </select>
          </form>
        </div>
        <div class="events__cards">
          <p class="events__error error-message"></p>
        </div>
      </section>
    </main>
    <div class="modal">
      <div class="modal__dialog">
        <div class="modal__top">
          <div class="modal__subtitle subtitle">Запись</div>
          <h2 class="modal__title title">Заголовок</h2>
          <p class="modal__description description">Описание мероприятия</p>
          <button class="modal__close">×</button>
        </div>
        <div class="modal__bottom">
          <form class="modal-form form">
            <label class="modal-form__label modal-form__label_name label"
              >Имя
              <input
                type="text"
                class="modal-form__input modal-form__input_name input"
              />
            </label>
            <label class="modal-form__label modal-form__label_email label"
              >Email
              <input
                type="email"
                class="modal-form__input modal-form__input_email input"
              />
            </label>
          </form>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
