<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <div class="logo">Event<span>ly</span></div>
      <nav class="menu">
        <button class="menu__item">Мероприятия</button>
        <button class="menu__item">Мои записи</button>
      </nav>
    </header>
    <main class="events-page">
      <section class="hero">
        <div class="hero__subtitle subtitle">Подзаголовок</div>
        <h1 class="hero__title title">Заголовок</h1>
        <p class="hero__description description">
          Выбирай интересное мероприятие и записывайся в пару кликов.
        </p>
      </section>
      <section class="events">
        <div class="events__filters">
          <form class="search-form">
            <input type="text" class="search-form__input" />
          </form>
          <form class="category-form">
            <select class="category-form__select"></select>
          </form>
        </div>
        <div class="events__cards">
          <article class="event-card">
            <div class="event-card__content">
              <div class="event-card__top">
                <div class="event-card__subtitle subtitle">Категория</div>
                <h2 class="event-card__title title">Заголовок</h2>
                <p class="event-card__description description">
                  Описание мероприятия
                </p>
              </div>
              <div class="event-card__bottom">
                <div class="event-card__details event-card__date">
                  <span class="icon">
                    <span class="icon__image">◷</span>
                  </span>
                  <span class="date">12 октября, 19:00</span>
                </div>
                <div class="event-card__details event-card__location">
                  <span class="icon">
                    <span class="icon__image">⌖</span>
                  </span>
                  <span class="location">Impact Hub</span>
                </div>
                <div class="event-card__details event-card__capacity">
                  <span class="capacity"
                    ><span class="capacity__number">24</span> мест</span
                  >
                </div>
                <button class="button">Записаться</button>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>
    <div class="modal">
      <div class="modal__dialog">
        <div class="modal__top">
          <div class="modal__subtitle subtitle">Запись</div>
          <h2 class="modal__title title">Заголовок</h2>
          <p class="modal__description description">Описание мероприятия</p>
          <button class="modal__close">×</button>
        </div>
        <div class="modal__bottom">
          <form class="modal-form">
            <label class="modal-form__label modal-form__label_name"
              >Имя
              <input
                type="text"
                class="modal-form__input modal-form__input_name"
              />
            </label>
            <label class="modal-form__label modal-form__label_email"
              >Email
              <input
                type="email"
                class="modal-form__input modal-form__input_email"
              />
            </label>
          </form>
        </div>
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
