<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="shortcut icon" href="./assets/Calendar.svg" type="image/x-icon">
    <title>Evently — Афиша событий</title>
  </head>
  <body class="body">
    <header class="header">
      <div class="logo">Event<span>ly</span></div>
      <nav class="menu">
        <button class="menu__item menu__item_events">Мероприятия</button>
        <button class="menu__item menu__item_registrations">Мои записи</button>
        <button class="menu__item menu__item_theme"><img class="icon__image" src="./assets/Group 37017.svg"></button>
    </header>
    <main class="events-page">
      <section class="hero">
        <div class="hero__subtitle subtitle">Мероприятия</div>
        <h1 class="hero__title title">Будь в центре событий</h1>
        <p class="hero__description description">
          Выбирай интересное мероприятие и записывайся в пару кликов.
        </p>
      </section>
      <section class="events">
        <div class="events__filters">
          <form class="filters-form form">
            <input
              type="text"
              placeholder="Поиск по названию и описанию..."
              class="filters-form__input input"
            />
            <select class="filters-form__select select">
              <option class="filters-form__default" value="" selected>
                Все категории
              </option>
            </select>
          </form>
        </div>
        <div class="events__cards"></div>
          </div>
        </div>
      </section>
    </main>
    <div class="modal">
      <div class="modal__dialog">
        <div class="modal__top">
          <div class="modal__subtitle subtitle">Запись</div>
          <h2 class="modal__title title">Заголовок</h2>
          <p class="modal__description description">
            Оставь контакты, чтобы подтвердить участие
          </p>
          <button class="modal__close">×</button>
        </div>
        <div class="modal__bottom">
          <form class="modal-form form"></form>
        </div>
      </div>
    </div>
    <script type="module" src="./scripts/app.js"></script>
  </body>
</html>
